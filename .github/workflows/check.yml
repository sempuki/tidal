# Runs every check on each push to main and each pull request.
# The same checks run locally with tools/check_all.sh.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      TIDAL_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4

      - name: Specification cross-references
        run: python3 -I tools/check_specification.py

      # Compiler images are rebuilt from the layer cache, so only changed
      # Dockerfiles cost real build time.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build compiler images
        env:
          TIDAL_BUILD_COMMAND: docker buildx build
          TIDAL_BUILD_FLAGS: >-
            --load
            --cache-from type=gha,scope={id}
            --cache-to type=gha,mode=max,scope={id}
        run: python3 -I tools/containers.py build

      # Test results are cached per test, compiler image, and expectation
      # (tools/run_tests.py), so a push retests only what changed. Each run
      # saves a new cache entry; restore-keys picks up the latest one.
      - name: Restore test result cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: tidal-results-${{ github.run_id }}
          restore-keys: tidal-results-

      # The runner has no copy of the host compilers, so CI uses the
      # containerized compilers, which include the same versions.
      - name: Conformance tests
        run: |
          mkdir -p build && touch build/run-start
          python3 -I tools/run_tests.py --compilers containers --report build/RESULTS.md

      - name: Page examples
        run: python3 -I tools/check_examples.py --compilers containers

      # Entries that this run did not use belong to old tests or old
      # images. Dropping them keeps the cache from growing without bound.
      - name: Prune test result cache
        if: always()
        run: find build/cache -type f ! -newer build/run-start -delete 2>/dev/null || true

      - name: Save test result cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/cache
          key: tidal-results-${{ github.run_id }}

      # The reference corpus is fetched outside the checkout and never printed.
      - name: Similarity check
        run: |
          git clone --quiet --depth 1 --branch n4950 \
            https://github.com/cplusplus/draft "$RUNNER_TEMP/reference"
          python3 -I tools/similarity.py --reference "$RUNNER_TEMP/reference/source" \
            --out build/similarity.txt --fail-on-flag

      - name: Build site
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet -r tools/requirements-site.txt
          python3 -I tools/build_site.py --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidal
          path: |
            build/RESULTS.md
            build/similarity.txt
          if-no-files-found: ignore

  # Publishes the site to GitHub Pages after a push to main.
  deploy:
    needs: check
    # Skipped until GitHub Pages is enabled and the repository variable
    # TIDAL_PAGES is set to true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TIDAL_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
